<div>
  <span class="field-label" id="url-mode-label">Mode</span>
  <div class="flex gap-2" role="radiogroup" aria-labelledby="url-mode-label" id="url-mode-group">
    <button type="button" role="radio" aria-checked="true" tabindex="0" data-mode="component" class="btn-primary">Component</button>
    <button type="button" role="radio" aria-checked="false" tabindex="-1" data-mode="form" class="btn-secondary">Form field (+ for space)</button>
  </div>
</div>

<div class="mt-4">
  <label for="url-input" class="field-label">Input</label>
  <textarea id="url-input" class="field-textarea" rows="6" spellcheck="false" placeholder="https://example.com/search?q=hello world"></textarea>
</div>

<div class="mt-3 flex flex-wrap gap-2">
  <button type="button" id="url-encode" class="btn-primary">Encode</button>
  <button type="button" id="url-decode" class="btn-secondary">Decode</button>
  <button type="button" id="url-swap" class="btn-secondary">Swap ⇄</button>
  <button type="button" id="url-clear" class="btn-ghost">Clear</button>
</div>

<div class="mt-4">
  <label for="url-output" class="field-label">Output</label>
  <textarea id="url-output" class="field-textarea" rows="6" spellcheck="false" readonly></textarea>
</div>

<div id="url-status" class="mt-2 min-h-[1.25rem] text-sm text-danger" role="status" aria-live="polite"></div>

<div class="mt-3">
  <button type="button" id="url-copy" class="btn-secondary">Copy output</button>
</div>

<section class="prose-tool mt-12">
  <h2>When to use each mode</h2>
  <p>
    Use <strong>Component</strong> mode when encoding a single value you're
    about to insert into a URL (a search term, a path segment). Use
    <strong>Form field</strong> mode when working with a full query string
    or form body, where browsers represent spaces as <code>+</code> rather
    than <code>%20</code>.
  </p>
</section>
