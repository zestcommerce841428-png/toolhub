<div class="grid gap-4">
  <div>
    <label for="meta-title" class="field-label">Page title</label>
    <input type="text" id="meta-title" class="field-input" placeholder="ToolHub — Free Browser Tools" maxlength="200" />
    <p id="meta-title-hint" class="field-hint"></p>
  </div>

  <div>
    <label for="meta-description" class="field-label">Meta description</label>
    <textarea id="meta-description" class="field-textarea" rows="3" placeholder="A short, compelling summary of the page." maxlength="400"></textarea>
    <p id="meta-description-hint" class="field-hint"></p>
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <div>
      <label for="meta-url" class="field-label">Page URL</label>
      <input type="url" id="meta-url" class="field-input" placeholder="https://example.com/page/" />
    </div>
    <div>
      <label for="meta-image" class="field-label">Share image URL</label>
      <input type="url" id="meta-image" class="field-input" placeholder="https://example.com/og-image.png" />
    </div>
    <div>
      <label for="meta-site-name" class="field-label">Site name</label>
      <input type="text" id="meta-site-name" class="field-input" placeholder="ToolHub" />
    </div>
    <div>
      <label for="meta-twitter" class="field-label">Twitter/X handle</label>
      <input type="text" id="meta-twitter" class="field-input" placeholder="@toolhub" />
    </div>
  </div>
</div>

<div class="mt-6">
  <label for="meta-output" class="field-label">Generated tags</label>
  <textarea id="meta-output" class="field-textarea font-mono" rows="14" readonly></textarea>
  <div class="mt-3 flex flex-wrap gap-2">
    <button type="button" id="meta-copy" class="btn-secondary">Copy</button>
    <button type="button" id="meta-download" class="btn-secondary">Download .html</button>
  </div>
</div>

<section class="prose-tool mt-12">
  <h2>Where do these tags go?</h2>
  <p>
    Paste the generated snippet inside your page's <code>&lt;head&gt;</code>
    element, after the charset and viewport meta tags. Fields you leave
    blank are simply skipped in the output rather than emitted empty.
  </p>
</section>
