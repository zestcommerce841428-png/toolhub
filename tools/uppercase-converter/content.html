<div>
  <label for="uppercase-converter-input" class="field-label">Your text</label>
  <textarea
    id="uppercase-converter-input"
    class="field-textarea"
    rows="8"
    placeholder="Type or paste your text here…"
  ></textarea>
</div>

<div class="mt-6">
  <label for="uppercase-converter-output" class="field-label">UPPERCASE result</label>
  <textarea id="uppercase-converter-output" class="field-textarea" rows="8" readonly></textarea>
  <div class="mt-3 flex flex-wrap gap-2">
    <button type="button" id="uppercase-converter-copy" class="btn-secondary">Copy result</button>
    <button type="button" id="uppercase-converter-download" class="btn-secondary">Download .txt</button>
    <button type="button" id="uppercase-converter-clear" class="btn-ghost">Clear</button>
  </div>
</div>

<section class="prose-tool mt-12">
  <h2>About uppercase conversion</h2>
  <p>
    Every letter is converted to its capital form as you type — numbers,
    punctuation, and spacing are left untouched. Need lowercase, Title
    Case, or another style instead? The full
    <a href="/tools/case-converter/">Case Converter</a> covers all of them
    in one place.
  </p>
</section>
