<div>
  <label for="title-case-converter-input" class="field-label">Your text</label>
  <textarea
    id="title-case-converter-input"
    class="field-textarea"
    rows="8"
    placeholder="Type or paste your text here…"
  ></textarea>
</div>

<div class="mt-6">
  <label for="title-case-converter-output" class="field-label">Title Case result</label>
  <textarea id="title-case-converter-output" class="field-textarea" rows="8" readonly></textarea>
  <div class="mt-3 flex flex-wrap gap-2">
    <button type="button" id="title-case-converter-copy" class="btn-secondary">Copy result</button>
    <button type="button" id="title-case-converter-download" class="btn-secondary">Download .txt</button>
    <button type="button" id="title-case-converter-clear" class="btn-ghost">Clear</button>
  </div>
</div>

<section class="prose-tool mt-12">
  <h2>About Title Case</h2>
  <p>
    Your text is lowercased first, then the first letter of every word is
    capitalized. Need something that preserves the rest of each word
    instead? Try <a href="/tools/capitalize-words/">Capitalize Words</a>,
    or see every case style side by side in the full
    <a href="/tools/case-converter/">Case Converter</a>.
  </p>
</section>
