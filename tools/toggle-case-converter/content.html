<div>
  <label for="toggle-case-converter-input" class="field-label">Your text</label>
  <textarea
    id="toggle-case-converter-input"
    class="field-textarea"
    rows="8"
    placeholder="Type or paste your text here…"
  ></textarea>
</div>

<div class="mt-6">
  <label for="toggle-case-converter-output" class="field-label">tOGGLE cASE result</label>
  <textarea id="toggle-case-converter-output" class="field-textarea" rows="8" readonly></textarea>
  <div class="mt-3 flex flex-wrap gap-2">
    <button type="button" id="toggle-case-converter-copy" class="btn-secondary">Copy result</button>
    <button type="button" id="toggle-case-converter-download" class="btn-secondary">Download .txt</button>
    <button type="button" id="toggle-case-converter-clear" class="btn-ghost">Clear</button>
  </div>
</div>

<section class="prose-tool mt-12">
  <h2>About Toggle Case</h2>
  <p>
    Every letter's case is inverted, one at a time — uppercase becomes
    lowercase and lowercase becomes uppercase. It's a novelty format more
    than a practical one, but it's handy for stylized text or spotting
    which characters in a string are letters at a glance.
  </p>
</section>
