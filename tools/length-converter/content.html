<div class="grid gap-4 sm:grid-cols-[1fr_auto_1fr]">
  <div>
    <label for="length-value" class="field-label">Value</label>
    <input type="number" id="length-value" class="field-input" value="1" step="any" inputmode="decimal" />
    <label for="length-from" class="field-label mt-3">From</label>
    <select id="length-from" class="field-select"></select>
  </div>

  <div class="flex items-end justify-center pb-2 sm:pb-0 sm:pt-8">
    <button type="button" id="length-swap" class="btn-icon border border-border" aria-label="Swap units">⇄</button>
  </div>

  <div>
    <label for="length-result" class="field-label">Result</label>
    <input type="text" id="length-result" class="field-input font-mono" readonly />
    <label for="length-to" class="field-label mt-3">To</label>
    <select id="length-to" class="field-select"></select>
  </div>
</div>

<div class="mt-3">
  <button type="button" id="length-copy" class="btn-secondary">Copy result</button>
</div>

<div class="card mt-8">
  <h2 class="mb-3 text-sm font-semibold text-text">All units</h2>
  <dl id="length-all-units" class="grid grid-cols-2 gap-x-4 gap-y-3 text-sm sm:grid-cols-4"></dl>
</div>

<section class="prose-tool mt-12">
  <h2>How this converter works</h2>
  <p>
    Every unit is defined by its exact length in meters, so a conversion
    from any unit to any other goes through meters internally — you just
    see the result. The table above shows your value converted into every
    supported unit at once, updated live as you type.
  </p>
</section>
