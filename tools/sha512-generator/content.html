<div>
  <label for="sha512-input" class="field-label">Text</label>
  <textarea id="sha512-input" class="field-textarea" rows="8" spellcheck="false" placeholder="Type or paste text to hash…"></textarea>
</div>

<div class="mt-3">
  <label class="flex items-center gap-2 text-sm text-text">
    <input type="checkbox" id="sha512-uppercase" class="h-4 w-4 rounded border-border accent-primary" />
    Uppercase output
  </label>
</div>

<div class="mt-4">
  <label for="sha512-output" class="field-label">SHA-512 hash</label>
  <input type="text" id="sha512-output" class="field-input font-mono" readonly />
</div>

<div class="mt-3 flex flex-wrap gap-2">
  <button type="button" id="sha512-copy" class="btn-secondary">Copy hash</button>
</div>

<section class="prose-tool mt-12">
  <h2>About SHA-512</h2>
  <p>
    SHA-512 produces a fixed 512-bit (128 hex character) digest — the
    widest common member of the SHA-2 family. It's secure, and on 64-bit
    hardware often computes faster than SHA-256 despite the larger output,
    since its internal operations work on 64-bit words natively.
  </p>
</section>
