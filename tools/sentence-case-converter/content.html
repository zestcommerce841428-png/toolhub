<div>
  <label for="sentence-case-converter-input" class="field-label">Your text</label>
  <textarea
    id="sentence-case-converter-input"
    class="field-textarea"
    rows="8"
    placeholder="Type or paste your text here…"
  ></textarea>
</div>

<div class="mt-6">
  <label for="sentence-case-converter-output" class="field-label">Sentence case result</label>
  <textarea id="sentence-case-converter-output" class="field-textarea" rows="8" readonly></textarea>
  <div class="mt-3 flex flex-wrap gap-2">
    <button type="button" id="sentence-case-converter-copy" class="btn-secondary">Copy result</button>
    <button type="button" id="sentence-case-converter-download" class="btn-secondary">Download .txt</button>
    <button type="button" id="sentence-case-converter-clear" class="btn-ghost">Clear</button>
  </div>
</div>

<section class="prose-tool mt-12">
  <h2>About Sentence case</h2>
  <p>
    Your text is lowercased, then the first letter of every sentence is
    capitalized — matching how sentences are normally written in prose.
    Need every word capitalized instead? See the full
    <a href="/tools/case-converter/">Case Converter</a> for Title Case and
    other styles.
  </p>
</section>
