<div class="flex flex-wrap items-end gap-4">
  <label class="flex items-center gap-2 pb-2 text-sm text-text">
    <input type="checkbox" id="csv2json-header" checked class="h-4 w-4 rounded border-border accent-primary" />
    First row is a header
  </label>
  <div>
    <label for="csv2json-delimiter" class="field-label">Delimiter</label>
    <select id="csv2json-delimiter" class="field-select w-32">
      <option value="," selected>Comma (,)</option>
      <option value=";">Semicolon (;)</option>
      <option value="tab">Tab</option>
    </select>
  </div>
</div>

<div class="mt-4">
  <label for="csv2json-input" class="field-label">CSV</label>
  <textarea id="csv2json-input" class="field-textarea font-mono" rows="10" spellcheck="false" placeholder="name,age,city&#10;Alice,30,Boston&#10;Bob,25,Denver"></textarea>
</div>

<p id="csv2json-error" class="field-error mt-2 hidden" role="alert"></p>

<div class="mt-4">
  <label for="csv2json-output" class="field-label">JSON</label>
  <textarea id="csv2json-output" class="field-textarea font-mono" rows="10" readonly spellcheck="false"></textarea>
  <div class="mt-3 flex flex-wrap gap-2">
    <button type="button" id="csv2json-copy" class="btn-secondary">Copy</button>
    <button type="button" id="csv2json-download" class="btn-secondary">Download .json</button>
  </div>
</div>

<section class="prose-tool mt-12">
  <h2>Handles real-world CSV, not just simple rows</h2>
  <p>
    Quoted fields containing commas, embedded quotes
    (<code>""escaped""</code>), and embedded newlines are all parsed
    correctly per the standard CSV convention (RFC 4180) — not a naive
    split on every comma, which breaks the moment a field like
    <code>"Doe, Jane"</code> appears.
  </p>
</section>
