<div class="grid gap-4 sm:grid-cols-[1fr_auto_1fr]">
  <div>
    <label for="weight-value" class="field-label">Value</label>
    <input type="number" id="weight-value" class="field-input" value="1" step="any" inputmode="decimal" />
    <label for="weight-from" class="field-label mt-3">From</label>
    <select id="weight-from" class="field-select"></select>
  </div>

  <div class="flex items-end justify-center pb-2 sm:pb-0 sm:pt-8">
    <button type="button" id="weight-swap" class="btn-icon border border-border" aria-label="Swap units">⇄</button>
  </div>

  <div>
    <label for="weight-result" class="field-label">Result</label>
    <input type="text" id="weight-result" class="field-input font-mono" readonly />
    <label for="weight-to" class="field-label mt-3">To</label>
    <select id="weight-to" class="field-select"></select>
  </div>
</div>

<div class="mt-3">
  <button type="button" id="weight-copy" class="btn-secondary">Copy result</button>
</div>

<div class="card mt-8">
  <h2 class="mb-3 text-sm font-semibold text-text">All units</h2>
  <dl id="weight-all-units" class="grid grid-cols-2 gap-x-4 gap-y-3 text-sm sm:grid-cols-4"></dl>
</div>

<section class="prose-tool mt-12">
  <h2>How this converter works</h2>
  <p>
    Every unit is defined by its exact weight in kilograms (the pound, for
    instance, is defined internationally as exactly 0.45359237 kg), so a
    conversion between any two units goes through kilograms internally and
    stays accurate to floating-point precision.
  </p>
</section>
