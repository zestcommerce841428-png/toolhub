<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script>{{THEME_BOOTSTRAP_SCRIPT}}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}" />
  <link rel="canonical" href="{{CANONICAL_URL}}" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{SITE_NAME}}" />
  <meta property="og:title" content="{{OG_TITLE}}" />
  <meta property="og:description" content="{{META_DESCRIPTION}}" />
  <meta property="og:url" content="{{CANONICAL_URL}}" />
  <meta property="og:image" content="{{OG_IMAGE}}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="{{TWITTER_HANDLE}}" />
  <meta name="twitter:title" content="{{OG_TITLE}}" />
  <meta name="twitter:description" content="{{META_DESCRIPTION}}" />

  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/main.css" />

  {{JSON_LD}}
</head>
<body class="min-h-screen bg-bg text-text">
  <a class="skip-link" href="#main-content">Skip to content</a>

  {{HEADER}}

  <main id="main-content">
    <section class="border-b border-border bg-surface">
      <div class="mx-auto max-w-4xl px-4 py-16 text-center sm:px-6 lg:px-8">
        <h1 class="text-4xl font-bold tracking-tight text-text sm:text-5xl">Every tool you need. Zero uploads.</h1>
        <p class="mx-auto mt-4 max-w-2xl text-lg text-text-muted">{{TAGLINE}}</p>
        <div class="mx-auto mt-8 max-w-xl">
          <label for="home-search-input" class="sr-only">Search tools</label>
          <div class="relative">
            <input
              id="home-search-input"
              type="search"
              placeholder="Try “word counter”, “json formatter”, “bmi”…"
              autocomplete="off"
              class="field-input py-3 pr-8 text-base shadow-sm"
            />
            <ul id="home-search-results" hidden class="absolute z-50 mt-1 max-h-96 w-full overflow-auto rounded-lg border border-border bg-surface-raised p-1 text-left shadow-lg"></ul>
          </div>
        </div>
        <p class="mt-3 text-sm text-text-subtle">{{TOOL_TOTAL}} tools and counting — every one runs 100% in your browser.</p>
      </div>
    </section>

    <section class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
      <h2 class="mb-6 text-2xl font-bold text-text">Browse by category</h2>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
        {{CATEGORY_CARDS_HTML}}
      </div>
    </section>

    <section class="mx-auto max-w-7xl px-4 pb-16 sm:px-6 lg:px-8">
      <h2 class="mb-6 text-2xl font-bold text-text">Popular tools</h2>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
        {{FEATURED_TOOL_CARDS_HTML}}
      </div>
    </section>
  </main>

  {{FOOTER}}

  <script type="module" src="/assets/js/app.js"></script>
  <script type="module">
    import { initSearch } from "/assets/js/core/search.js";
    const inputEl = document.getElementById("home-search-input");
    const resultsEl = document.getElementById("home-search-results");
    if (inputEl && resultsEl) {
      initSearch({
        inputEl,
        resultsEl,
        onNavigate: (tool) => { window.location.href = `/tools/${tool.slug}/`; },
      });
    }
  </script>
</body>
</html>
