<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script>{{THEME_BOOTSTRAP_SCRIPT}}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}" />
  <link rel="canonical" href="{{CANONICAL_URL}}" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{SITE_NAME}}" />
  <meta property="og:title" content="{{OG_TITLE}}" />
  <meta property="og:description" content="{{META_DESCRIPTION}}" />
  <meta property="og:url" content="{{CANONICAL_URL}}" />
  <meta property="og:image" content="{{OG_IMAGE}}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="{{TWITTER_HANDLE}}" />
  <meta name="twitter:title" content="{{OG_TITLE}}" />
  <meta name="twitter:description" content="{{META_DESCRIPTION}}" />
  <meta name="twitter:image" content="{{OG_IMAGE}}" />

  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="./tool.css" />

  {{JSON_LD}}
</head>
<body class="min-h-screen bg-bg text-text">
  <a class="skip-link" href="#main-content">Skip to content</a>

  {{HEADER}}

  <main id="main-content" class="mx-auto max-w-5xl px-4 py-8 sm:px-6 lg:px-8">
    <nav aria-label="Breadcrumb" class="mb-4">
      <ol class="breadcrumb-list">
        {{BREADCRUMB_HTML}}
      </ol>
    </nav>

    <article>
      <header class="mb-6">
        <span class="badge">{{CATEGORY_NAME}}</span>
        <h1 class="mt-2 text-3xl font-bold tracking-tight text-text sm:text-4xl">{{TOOL_NAME}}</h1>
        <p class="mt-2 max-w-2xl text-base text-text-muted">{{TOOL_DESCRIPTION}}</p>
      </header>

      {{CONTENT}}

      <section aria-labelledby="faq-heading" class="mt-12">
        <h2 id="faq-heading" class="mb-4 text-xl font-semibold text-text">Frequently asked questions</h2>
        <div class="space-y-2">
          {{FAQ_HTML}}
        </div>
      </section>

      {{RELATED_TOOLS_SECTION}}
    </article>
  </main>

  {{FOOTER}}

  <script type="module" src="/assets/js/app.js"></script>
  <script type="module" src="./tool.js"></script>
</body>
</html>
