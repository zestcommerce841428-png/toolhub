<header class="sticky top-0 z-40 border-b border-border bg-bg/95 backdrop-blur supports-[backdrop-filter]:bg-bg/80">
  <div class="mx-auto flex max-w-7xl items-center gap-3 px-4 py-3 sm:px-6 lg:px-8">
    <a href="/" class="flex shrink-0 items-center gap-2 text-lg font-bold text-text">
      <span class="flex h-8 w-8 brand-mark" aria-hidden="true">TH</span>
      <span class="hidden sm:inline">ToolHub</span>
    </a>

    <!--
      One dropdown, every screen size — not an inline link per category.
      An earlier version rendered every category as its own top-level nav
      link, which needed a breakpoint tuned to however many categories
      existed at the time (5, then 6) and broke again the moment the
      catalog grew past that (12 categories overflowed at both the old
      and a re-tuned breakpoint — verified by a Playwright viewport
      sweep). A fixed-width trigger button scales to any category count
      without ever needing another breakpoint adjustment, which matters
      for a catalog aimed at 1,500 tools across many more categories than
      exist today. The dropdown itself doubles as the mobile menu, so
      there's only one nav implementation to maintain, not two.
    -->
    <details class="relative shrink-0">
      <summary class="btn-secondary list-none" aria-haspopup="true">
        <span aria-hidden="true">🗂️</span>
        <span class="hidden sm:inline">Categories</span>
        <span aria-hidden="true">▾</span>
      </summary>
      <nav aria-label="Categories" class="absolute left-0 z-50 mt-2 w-64 max-h-[70vh] overflow-auto rounded-lg border border-border bg-surface-raised p-2 shadow-lg">
        <ul class="flex flex-col">
          {{CATEGORY_NAV_LINKS}}
          <li><a class="block rounded-md px-3 py-2 text-sm font-semibold text-primary hover:bg-surface" href="/categories/">All categories</a></li>
        </ul>
      </nav>
    </details>

    <!--
      A fixed min-width (rather than min-w-0) overrides the flex default
      of min-width:auto — which would otherwise refuse to shrink this box
      below its content's natural width and overflow the header on narrow
      screens — while still keeping the search box from shrinking down to
      a useless sliver. 110px comfortably fits alongside the logo/theme
      toggle/hamburger even at a 320px viewport (verified with a
      Playwright viewport sweep). The .field-input class itself also
      carries min-w-0, which is the separate fix for a browser-default
      intrinsic minimum width text inputs specifically carry — see
      assets/css/app.css.
    -->
    <div class="relative ml-auto w-full min-w-[110px] max-w-xs">
      <label for="site-search-input" class="sr-only">Search tools</label>
      <input
        id="site-search-input"
        type="search"
        placeholder="Search 1,500+ tools…"
        autocomplete="off"
        class="field-input pr-8"
      />
      <kbd class="pointer-events-none absolute right-2 top-1/2 hidden -translate-y-1/2 rounded border border-border bg-surface px-1.5 py-0.5 text-[11px] text-text-subtle sm:block">Ctrl K</kbd>
      <ul id="site-search-results" hidden class="absolute z-50 mt-1 max-h-96 w-full overflow-auto rounded-lg border border-border bg-surface-raised p-1 shadow-lg"></ul>
    </div>

    <button
      type="button"
      id="theme-toggle-button"
      data-theme-toggle
      class="btn-icon shrink-0 border border-border"
    >
      <span aria-hidden="true" data-theme-icon-light>🌙</span>
      <span aria-hidden="true" data-theme-icon-dark class="hidden">☀️</span>
    </button>
  </div>
</header>
