name: Post-deploy smoke test

# Fires from GitHub's native Deployments API, which Vercel's GitHub
# integration uses to report each deployment's status (production and PR
# previews alike) — no polling, no extra Vercel-specific action needed.
# Deliberately a separate workflow from ci.yml: this checks the real,
# already-live URL after Vercel has finished building and serving it,
# which is a genuinely different thing from ci.yml's pre-merge checks
# against a locally-built artifact, and runs on its own schedule (whenever
# a deployment finishes) rather than on push/PR.
#
# Production only, deliberately: this project's Vercel deployment
# protection (Standard/SSO Protection) covers every *deployment* URL by
# design — including each individual production deployment's own unique
# URL, which 302-redirects to a Vercel login page just like a preview
# does (verified directly: curling the environment_url a real "Production"
# deployment_status event reports returns 302, while the stable aliased
# domain below returns 200). Only the stable production alias is exempt,
# and there's no field in the deployment/deployment_status webhook payload
# that reports it — GitHub's `environment_url`/`target_url` always point
# at the ephemeral per-deployment URL — so it's a repo variable
# (Settings > Secrets and variables > Actions > Variables >
# PRODUCTION_URL) instead of anything derived from the event.
on:
  deployment_status:

concurrency:
  group: post-deploy-smoke-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  smoke:
    # Verified against this repo's actual deployment history (GitHub
    # API), not assumed: Vercel's integration sets environment to the
    # capitalized "Preview"/"Production", not lowercase — a lowercase
    # comparison here would have silently never matched anything.
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Built locally (from the exact commit Vercel deployed) purely so
      # tests/e2e/helpers.js has a public/assets/data/search-index.json to
      # read the expected tool count/slugs from — the smoke test itself
      # still runs entirely against the live BASE_URL below, never the
      # local server.
      - run: npm run build

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright's Chromium (only on a cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install just the OS-level Chromium deps (cache hit — browser binary already present)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Fail loudly if PRODUCTION_URL isn't configured
        if: vars.PRODUCTION_URL == ''
        run: |
          echo "::error::Repo variable PRODUCTION_URL is not set (Settings > Secrets and variables > Actions > Variables). Set it to the stable production alias — not a per-deployment URL, which Vercel's deployment protection blocks — before this check can run."
          exit 1

      - name: Smoke test the live deployment
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: npx playwright test tests/e2e/smoke.spec.js

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: post-deploy-smoke-report
          path: playwright-report/
          retention-days: 14
