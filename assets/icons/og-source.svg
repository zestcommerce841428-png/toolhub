<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="ogMarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="55%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="ogBgGlow" cx="20%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#eef2ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBgGlow)" />

  <!-- Gear-tooth ring accent behind the mark: a dashed circle reads as
       teeth at this scale without hand-computing a gear polygon's path,
       and stays crisp at any raster size since it's just a stroke. -->
  <circle cx="230" cy="315" r="192" fill="none" stroke="#2563eb" stroke-opacity="0.18" stroke-width="22" stroke-dasharray="16 14" />
  <circle cx="230" cy="315" r="150" fill="none" stroke="#0f172a" stroke-opacity="0.10" stroke-width="2" />

  <rect x="100" y="185" width="260" height="260" rx="58" fill="url(#ogMarkGradient)" />
  <text
    x="230" y="345"
    text-anchor="middle"
    font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif"
    font-size="124" font-weight="800" letter-spacing="-3"
    fill="#ffffff"
  >TH</text>

  <text x="432" y="330" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2">
    <tspan fill="#2563eb">Tool</tspan><tspan fill="#0f172a">Hub</tspan>
  </text>

  <text x="434" y="380" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="#475569">
    Fast, private, browser-based tools.
  </text>

  <line x1="434" y1="428" x2="474" y2="428" stroke="#2563eb" stroke-width="3" />
  <text x="490" y="434" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2.5" fill="#0f172a">
    ALL TOOLS <tspan fill="#2563eb">· ONE HUB ·</tspan> ENDLESS POSSIBILITIES
  </text>
</svg>
